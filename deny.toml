# cargo-deny policy. Run locally with `just deny`; CI runs it on dependency changes and weekly.

[graph]
all-features = true

[advisories]
# Vulnerabilities, unsoundness and unmaintained crates are all errors unless listed here.
# Every entry needs the advisory id and a reason; re-check the list when dependencies move.
ignore = [
    # tract is pinned to =0.21.4 because DeepFilterNet (libDF) needs ndarray 0.15 and tract 0.21.5+
    # moved to ndarray 0.16 (see client/src-tauri/Cargo.toml). The fix is in 0.21.16 only. Pulse only
    # loads the DeepFilterNet model bundled in the binary, never an attacker-supplied NNEF file.
    "RUSTSEC-2026-0217",
    # Unmaintained crates, all transitive through Tauri/GTK or DeepFilterNet with no drop-in
    # replacement we control. No known vulnerability; revisit when upstreams move.
    # Paths checked with `cargo tree -i <crate> -e normal,build`.
    "RUSTSEC-2026-0319", # anymap2: build-dependency only (tract-linalg -> liquid -> liquid-core); not shipped
    "RUSTSEC-2024-0436", # paste: proc macro used by tract-core and tract-linalg (DeepFilterNet); compile-time only
    "RUSTSEC-2024-0370", # proc-macro-error: glib-macros and gtk3-macros (gtk, Tauri on Linux); compile-time only
    "RUSTSEC-2026-0370", # zvariant: zbus 5 via tauri-plugin-single-instance
    "RUSTSEC-2026-0371", # zbus_names: same chain
    "RUSTSEC-2026-0372", # zvariant_derive: same chain
]

[licenses]
# Explicit allow-list of every licence the dependency tree actually uses; no blanket allow.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (CA root data)
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# r-efi is "MIT OR Apache-2.0 OR LGPL-2.1-or-later": satisfied via MIT, LGPL stays out of the list.

[licenses.private]
# Our own crates are `publish = false` with a proprietary licence; ignore them for licence checks.
ignore = true

[bans]
# Duplicates are normal in a Tauri/GTK tree; surface them without failing the build.
multiple-versions = "warn"
wildcards = "deny"
# Workspace members and the patched vendor/webrtc-sys(-build) use `path = ...` dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# DeepFilterNet (libDF) is not on crates.io; pinned by rev in client/src-tauri/Cargo.toml.
allow-git = ["https://github.com/Rikorose/DeepFilterNet"]
# vendor/webrtc-sys is a local path crate patched in via [patch.crates-io];
# path sources need no entry.
