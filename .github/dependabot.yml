version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # deploy/server.Dockerfile (the server image built by release-server.yml)
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # image: lines in deploy/compose.yml (livekit, caddy) and the dev docker-compose.yml (livekit, kept
  # identical to prod: deploy-selftest.sh fails CI if they differ). The group puts both in one PR;
  # release-windows.yml's LIVEKIT_VERSION + SHA-256 are bumped by hand in it (deploy/README.md).
  - package-ecosystem: docker-compose
    directories: [/deploy, /]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  # rust-toolchain.toml (exact version used by CI, the Windows release and local builds)
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
