version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    # Deliberate pins, explained in client/src-tauri/Cargo.toml: drop these with the pins.
    ignore:
      # livekit 0.9.7 needs =0.1.7 (0.1.8 removed a field it sets); lift with livekit 0.10.
      - dependency-name: livekit-signaling
      # Must match the ndarray 0.15 that deep_filter and tract 0.21.4 use (#31).
      - dependency-name: ndarray
        versions: [">= 0.16"]

  - package-ecosystem: npm
    directory: /client/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # deploy/server.Dockerfile (the server image built by release-server.yml)
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # image: lines in deploy/compose.yml (livekit, caddy) and the dev docker-compose.yml (livekit, kept
  # identical to prod: deploy-selftest.sh fails CI if they differ). The group puts both in one PR.
  - package-ecosystem: docker-compose
    directories: [/deploy, /]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  # rust-toolchain.toml (exact version used by CI, the Windows release and local builds)
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
