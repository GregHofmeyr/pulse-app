name: release-windows

# Builds the NSIS installer + a self-contained local test kit (app, server, LiveKit, scripts).
# Public repo = free minutes, but a Windows build is ~10 min: run on release tags or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The test kit ships this LiveKit server build. Bump both together: take the SHA-256 of
  # livekit_<version>_windows_amd64.zip from the release's checksums.txt, cross-check the asset digest
  # GitHub shows on the release page (or `sha256sum` a fresh download), and paste it here.
  LIVEKIT_VERSION: 1.13.10
  LIVEKIT_WINDOWS_SHA256: fd4b7c2c3c1e4c71adaa4f6a046ad1c0abaaaf1e09fae904b35bf231ffae11d2
  # Release builds start the login screen on the real server.
  VITE_DEFAULT_SERVER: https://pulsechat.co.za
  # Bug reports name the build they came from.
  PULSE_COMMIT: ${{ github.sha }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exact version and components come from rust-toolchain.toml (rustup >= 1.28 installs what the file names).
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Exact versions, the same as ci.yml; Dependabot doesn't bump these inputs (see deploy/README.md).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: client/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: client/ui
      # The installer bundles the pinned LGPL ffmpeg (tauri.windows.conf.json); the script verifies its SHA-256.
      - name: Fetch ffmpeg (pinned in scripts/fetch-ffmpeg.sh)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh
      # Which H.264/AAC encoders this build has (the clip encoder tries h264_nvenc, h264_amf, h264_qsv, h264_mf,
      # libopenh264 in that order and skips what's missing).
      - name: ffmpeg encoders
        shell: bash
        run: client/src-tauri/ffmpeg/ffmpeg.exe -hide_banner -encoders | grep -E 'h264|aac'
      # Tauri CLI is an exact devDependency of client/ui (lockfile-pinned, audited, kept current by Dependabot), at the
      # `tauri` crate's version. Run through node so the app is found from src-tauri without a .cmd shim.
      - run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build
        working-directory: client/src-tauri
      # Screen-share stream code has Windows-only paths (process discovery, open failures) that Linux CI
      # never compiles. --release reuses the build above.
      - run: cargo test --release -p pulse-client --lib 'stream::' -- --skip 'stream::loopback'
      # Finding the bundled ffmpeg and the no-console-window spawn are Windows paths too.
      - run: cargo test --release -p pulse-client --lib 'clips::ffmpeg::'
      # Keybind hooks are Windows-only too (hook thread priority).
      - run: cargo test --release -p pulse-client --lib 'hotkeys::'
      # The session.json fallback's owner-only DACL is Windows-only too.
      - run: cargo test --release -p pulse-client --lib 'session::'
      # WASAPI process loopback: a runner with no audio endpoint can't activate it, so it doesn't block the kit.
      - continue-on-error: true
        run: cargo test --release -p pulse-client --lib 'stream::loopback'
      - run: cargo build --release -p pulse-server --bin pulse-app-server
      - name: Assemble test kit
        shell: pwsh
        run: |
          $kit = 'pulse-windows-kit'
          New-Item -ItemType Directory $kit | Out-Null
          Copy-Item kit/windows/* $kit
          Copy-Item target/release/pulse-app.exe, target/release/pulse-app-server.exe $kit
          Copy-Item target/release/bundle/nsis/*.exe $kit
          # pulse-app.exe run from the kit finds its resources beside itself, so ffmpeg/ goes there too.
          Copy-Item -Recurse client/src-tauri/ffmpeg "$kit/ffmpeg"
          # The installer bundles THIRD_PARTY.md (the bundled fonts' OFL text lives only there); the kit carries it too.
          Copy-Item THIRD_PARTY.md $kit
          $zip = "livekit_${env:LIVEKIT_VERSION}_windows_amd64.zip"
          Invoke-WebRequest "https://github.com/livekit/livekit/releases/download/v${env:LIVEKIT_VERSION}/$zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:LIVEKIT_WINDOWS_SHA256) {
            throw "SHA-256 mismatch for ${zip}: expected $env:LIVEKIT_WINDOWS_SHA256, got $actual. Not extracting it; re-pin LIVEKIT_WINDOWS_SHA256 only after verifying the new archive."
          }
          Expand-Archive $zip lk
          Copy-Item lk/livekit-server.exe $kit
          Copy-Item lk/LICENSE "$kit/LICENSE-livekit.txt"
          Get-ChildItem $kit | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-windows-kit
          path: pulse-windows-kit
