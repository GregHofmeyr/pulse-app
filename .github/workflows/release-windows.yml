name: release-windows

# Builds the NSIS installer (plus collect-logs.ps1 for bug reports).
# Public repo = free minutes, but a Windows build is ~10 min: run on release tags or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Release builds start the login screen on the real server.
  VITE_DEFAULT_SERVER: https://pulsechat.co.za
  # Bug reports name the build they came from.
  PULSE_COMMIT: ${{ github.sha }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exact version and components come from rust-toolchain.toml (rustup >= 1.28 installs what the file names).
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Exact versions, the same as ci.yml; Dependabot doesn't bump these inputs (see deploy/README.md).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: client/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: client/ui
      # The installer bundles the pinned LGPL ffmpeg (tauri.windows.conf.json); the script verifies its SHA-256.
      - name: Fetch ffmpeg (pinned in scripts/fetch-ffmpeg.sh)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh
      # Which H.264/AAC encoders this build has (the clip encoder tries h264_nvenc, h264_amf, h264_qsv, h264_mf,
      # libopenh264 in that order and skips what's missing).
      - name: ffmpeg encoders
        shell: bash
        run: client/src-tauri/ffmpeg/ffmpeg.exe -hide_banner -encoders | grep -E 'h264|aac'
      # Tauri CLI is an exact devDependency of client/ui (lockfile-pinned, audited, kept current by Dependabot), at the
      # `tauri` crate's version. Run through node so the app is found from src-tauri without a .cmd shim.
      - run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build
        working-directory: client/src-tauri
      - name: Assemble the download
        shell: pwsh
        run: |
          $out = 'pulse-windows-installer'
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe $out
          Copy-Item kit/windows/collect-logs.ps1 $out
          Get-ChildItem $out | Format-Table Name, Length
      # Not the download yet: `publish` renames it once `test` has passed too. Kept a day at most, for a failed run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: untested-pulse-windows-installer
          path: pulse-windows-installer
          retention-days: 1

  # Windows-only test paths, in parallel with `build` (the release-mode test binary compiles separately anyway).
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustc --version
      # Its own cache, so it and `build` don't overwrite each other's target dirs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-tests
      - name: Placeholder UI dist (tauri::generate_context! needs the folder)
        shell: bash
        run: mkdir -p client/ui/dist
      # The bundle's ffmpeg/* resources must exist to compile, and the clips::ffmpeg:: tests find it.
      - name: Fetch ffmpeg (pinned in scripts/fetch-ffmpeg.sh)
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh
      # Screen-share stream code has Windows-only paths (process discovery, open failures) that Linux CI
      # never compiles. The test binary compiles once here; the steps below reuse it.
      - run: cargo test --release -p pulse-client --lib 'stream::' -- --skip 'stream::loopback'
      # Finding the bundled ffmpeg and the no-console-window spawn are Windows paths too.
      - run: cargo test --release -p pulse-client --lib 'clips::ffmpeg::'
      # Keybind hooks are Windows-only too (hook thread priority).
      - run: cargo test --release -p pulse-client --lib 'hotkeys::'
      # The session.json fallback's owner-only DACL is Windows-only too.
      - run: cargo test --release -p pulse-client --lib 'session::'
      # WASAPI process loopback: a runner with no audio endpoint can't activate it, so it doesn't block the build.
      - continue-on-error: true
        run: cargo test --release -p pulse-client --lib 'stream::loopback'

  # The download exists only when both the build and the tests passed.
  publish:
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-windows-installer
          pattern: untested-pulse-windows-installer
          delete-merged: true
