name: release-windows

# Builds the NSIS installer + a self-contained local test kit (app, server, LiveKit, scripts).
# Public repo = free minutes, but a Windows build is ~10 min: run on release tags or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      spike:
        description: Build the screen-share spike (debug panel + loopback prototype)
        type: boolean
        default: false

permissions:
  contents: read

env:
  LIVEKIT_VERSION: 1.13.10
  # Release builds start the login screen on the real server.
  VITE_DEFAULT_SERVER: https://pulsechat.co.za
  # Bug reports name the build they came from.
  PULSE_COMMIT: ${{ github.sha }}
  # THROWAWAY (screen-share spike): '1' turns on the hidden debug panel in the UI build.
  VITE_SPIKE: ${{ inputs.spike && '1' || '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: client/ui
      # Prebuilt CLI from npm: no ~5 min `cargo install tauri-cli` on every run.
      - run: pnpm dlx @tauri-apps/cli@^2 build ${{ inputs.spike && '--features spike --config tauri.spike.conf.json' || '' }}
        working-directory: client/src-tauri
      # THROWAWAY (spike): the spike's Rust tests, on Windows (WASAPI loopback included). --release reuses the
      # build above. Doesn't block the kit: a runner with no audio endpoint can't activate loopback.
      - if: inputs.spike
        continue-on-error: true
        run: cargo test --release -p pulse-client --lib --features spike 'spike::'
      - run: cargo build --release -p pulse-server --bin pulse-app-server
      - name: Assemble test kit
        shell: pwsh
        run: |
          $kit = 'pulse-windows-kit'
          New-Item -ItemType Directory $kit | Out-Null
          Copy-Item kit/windows/* $kit
          Copy-Item target/release/pulse-app.exe, target/release/pulse-app-server.exe $kit
          Copy-Item target/release/bundle/nsis/*.exe $kit
          $zip = "livekit_${env:LIVEKIT_VERSION}_windows_amd64.zip"
          Invoke-WebRequest "https://github.com/livekit/livekit/releases/download/v${env:LIVEKIT_VERSION}/$zip" -OutFile $zip
          Expand-Archive $zip lk
          Copy-Item lk/livekit-server.exe $kit
          Copy-Item lk/LICENSE "$kit/LICENSE-livekit.txt"
          # THROWAWAY (spike): the S9 flash-and-beep page, opened in Edge/Chrome on the streamer PC.
          if ('${{ inputs.spike }}' -eq 'true') { Copy-Item client/ui/src/spike/testpattern.html $kit }
          Get-ChildItem $kit | Format-Table Name, Length
      - uses: actions/upload-artifact@v5
        with:
          name: pulse-windows-kit
          path: pulse-windows-kit
