[package]
name = "pulse-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pulse-app-server"
path = "src/main.rs"

[features]
testing = ["dep:reqwest", "dep:tempfile"]

[dependencies]
pulse-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
ulid.workspace = true
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
pulse-server = { path = ".", features = ["testing"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
