[package]
name = "pulse-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pulse-app"
path = "src/main.rs"

[lib]
name = "pulse_client"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulse-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tauri = { version = "2.12", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
futures = "0.3"
rand = "0.9"
livekit = { version = "0.9.3", features = ["rustls-tls-native-roots"] }
cpal = "0.18.2"
os_info = "3"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rubato = "5"
rtrb = "0.3"
audioadapter-buffers = "5.2.0"
nnnoiseless = { version = "0.5", default-features = false }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# libDF needs tract on ndarray 0.15; tract 0.21.7+ moved to ndarray 0.16 (semver-compatible bump
# that breaks libDF's types). Pinned to 0.21.4, the version libDF's own Cargo.lock uses (0.21.6 already renamed a field it needs).
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
tauri-plugin-single-instance = "2"

[features]
# Strong uses DeepFilterNet3's low-latency model (36 MB) instead of the normal one (8 MB).
dfn-ll = ["deep_filter/default-model-ll"]

[dev-dependencies]
tempfile = "3"
# paused-clock tests (`#[tokio::test(start_paused = true)]`)
tokio = { workspace = true, features = ["test-util"] }
pulse-server = { path = "../../server", features = ["testing"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "2"
# 0.18's `realtime` raises cpal's own WASAPI threads via MMCSS (0.15 never did: thread id passed as a handle).
cpal = { version = "0.18.2", features = ["realtime"] }
# MMCSS for our own audio threads (voice/rtprio.rs); already in the tree via tauri and cpal.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }
# WebView2 memory target (webview_memory.rs). Keep these on the versions tauri/wry use (see
# Cargo.lock), or the COM types don't match (E0308).
webview2-com = "0.39"
windows-core = "0.62"
