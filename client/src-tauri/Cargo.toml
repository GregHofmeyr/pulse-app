[package]
name = "pulse-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pulse-app"
path = "src/main.rs"

[lib]
name = "pulse_client"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulse-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tauri = { version = "2.12", features = ["protocol-asset"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
url = "2"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures = "0.3"
rand = "0.9"
sha2 = "0.11"
livekit = { version = "0.9.7", features = ["rustls-tls-native-roots"] }
# Not used directly: livekit 0.9.7 asks for ^0.1.7, but 0.1.8 (cut with livekit 0.10) removed a field
# 0.9.7 still sets. Drop this pin when moving to livekit 0.10.
livekit-signaling = "=0.1.7"
# The participant permission type livekit 0.9.7 hands out (server mute, #140) isn't re-exported.
livekit-protocol = "0.8.2"
cpal = "0.18.2"
os_info = "3"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rubato = "5"
rtrb = "0.4"
audioadapter-buffers = "5.2.0"
nnnoiseless = { version = "0.5", default-features = false }
# Strong's model (DeepFilterNet3, 8 MB) is compiled in; Strong (low delay)'s (36 MB) is downloaded on first use (#77,
# src/models.rs) and must be the file this rev's checkout ships (deploy/publish-models.sh).
deep_filter = { git ="https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# libDF needs tract on ndarray 0.15; tract 0.21.7+ moved to ndarray 0.16 (semver-compatible bump
# that breaks libDF's types). Pinned to 0.21.4, the version libDF's own Cargo.lock uses (0.21.6 already renamed a field it needs).
tract-core = "=0.21.4"
tract-onnx = "=0.23.9"
tract-pulse = "=0.23.9"
tract-hir = "=0.21.4"
tauri-plugin-single-instance = "2"
# The clip editor's file picker, called from Rust only (no webview permission is granted).
tauri-plugin-dialog = "2"
base64 = "0.22"
# The 2FA setup QR code, drawn by the UI from a module matrix (the otpauth URI itself never leaves Rust).
qrcode = { version = "0.14", default-features = false }
# Avatars in desktop notifications (notify/avatar.rs): the cached WebP avatar as a small PNG, which
# Windows toasts and every Linux notification service can show. Pure Rust (image-webp, png).
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "gif", "bmp"] }
# Attachments (#57): images are converted to lossy (and animated) WebP before upload, as the server
# encodes emoji; libwebp is built from source, so no system library is needed.
webp-animation = { version = "0.10", features = ["static"] }
# "Zip and send" for a dropped folder (#57): deflate only (flate2, already in the tree).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# App updates (updater.rs, #82): comparing the offered version with ours (the updater's own semver).
semver = "1"

[dev-dependencies]
tempfile = "3"
# tests/webrtc_log_volume.rs counts libwebrtc's log lines (it logs through the `log` facade)
log = "0.4"
# paused-clock tests (`#[tokio::test(start_paused = true)]`)
tokio = { workspace = true, features = ["test-util"] }
pulse-server = { path = "../../server", features = ["testing"] }
# tests/voice_it.rs asks LiveKit itself who is in a room (the server's version)
livekit-api = { version = "0.9.1", default-features = false, features = ["access-token", "services"] }
# tests compute the codes a phone would show (same version/features as the server)
totp-rs = { version = "6", default-features = false, features = ["std"] }
# tests/emoji_e2e.rs builds the PNG and GIF it uploads
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
# tests/voice_it.rs counts the PeerConnections alive in the process (the vendored copy's
# live_peer_connections, #227); the one livekit already builds
webrtc-sys = "0.3.52"

[target.'cfg(unix)'.dependencies]
# getuid for the hotkey socket's private fallback directory (ipc.rs); already in the tree.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux: talk to the sound server (PulseAudio, or PipeWire's pulse server) for real device names;
# ALSA stays the fallback. A pure-Rust client: no libpulse needed at build or run time.
cpal = { version = "0.18.2", features = ["pulseaudio"] }
# The sink's `device.form_factor` (voice/echo.rs: echo cancellation off on headphones). The same
# pure-Rust client cpal's pulseaudio host uses; no new crate in the tree.
pulseaudio = "0.3.2"
webkit2gtk = "2.0"
# Desktop notifications (notify/linux.rs) over D-Bus: zbus 5 on async-io, the same zbus the
# single-instance plugin already brings. Pure Rust, no libdbus. Called directly rather than through
# notify-rust, whose every notification opens its own connection (see notify/linux.rs).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
# 0.18's `realtime` raises cpal's own WASAPI threads via MMCSS (0.15 never did: thread id passed as a handle).
cpal = { version = "0.18.2", features = ["realtime"] }
# MMCSS for our own audio threads (voice/rtprio.rs); already in the tree via tauri and cpal.
# + low-level keyboard/mouse hooks for pass-through keybinds (hotkeys.rs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    # owner-only session.json fallback (session.rs): DACL from SDDL, created with it.
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # stream audio (stream/procs.rs, stream/loopback.rs): process list, audio sessions.
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_Audio",
    "Win32_System_Com",
    # clips (clips/ffmpeg.rs): ffmpeg children in a kill-on-close job object.
    "Win32_System_JobObjects",
    # links open in the default browser (links.rs).
    "Win32_UI_Shell",
    # message toasts (notify/windows.rs).
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
# WebView2 memory target (webview_memory.rs). Keep these on the versions tauri/wry use (see
# Cargo.lock), or the COM types don't match (E0308).
webview2-com = "0.39"
windows-core = "0.62"
# Stream audio: WASAPI process loopback (stream/loopback.rs). 0.26.0 depends on windows/windows-core
# ^0.62.2, the versions in Cargo.lock.
wasapi = "0.26"
# App updates (updater.rs, #82), driven from Rust only (no webview permission is granted); only the Windows app
# updates itself. 2.14.1 needs tauri ^2.12 (the lockfile's 2.12.2). Without the default `zip` (macOS/Linux bundles)
# and `system-proxy`. TLS through Windows' own (native-tls = SChannel): its `rustls-tls` turns on reqwest 0.13's
# `rustls-no-provider` for every reqwest 0.13 in the build (tauri's, livekit-api's), whose clients then panic without
# a process-wide crypto provider.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dev-dependencies]
# updater.rs's check against a stub endpoint runs the plugin in a mock app (#233); only the Windows build has it.
tauri = { version = "2.12", features = ["test"] }
