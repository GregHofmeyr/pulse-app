<!doctype html>
<!-- THROWAWAY (screen-share spike S9): open in Edge or Chrome, click once (audio needs a gesture), then share
     this window. Every 2 s: the screen flashes white for 100 ms and a 100 ms 1 kHz beep plays on the same tick. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pulse spike S9 test pattern</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #666; font: 14px sans-serif; }
    body.flash { background: #fff; }
    p { position: fixed; bottom: 8px; left: 8px; margin: 0; }
  </style>
</head>
<body>
  <p id="hint">Click anywhere to start. Then share this window.</p>
  <script>
    let ctx = null
    document.body.addEventListener('click', () => {
      if (ctx) return
      ctx = new AudioContext()
      document.getElementById('hint').textContent = 'Running: flash + beep every 2 s.'
      const period = 2000
      const tick = () => {
        // the beep is scheduled on the audio clock for "now"; the flash on the same frame
        const osc = ctx.createOscillator()
        const gain = ctx.createGain()
        osc.frequency.value = 1000
        gain.gain.value = 0.5
        osc.connect(gain).connect(ctx.destination)
        osc.start(ctx.currentTime)
        osc.stop(ctx.currentTime + 0.1)
        document.body.classList.add('flash')
        setTimeout(() => document.body.classList.remove('flash'), 100)
      }
      tick()
      setInterval(tick, period)
    })
  </script>
</body>
</html>
