# Local dev LiveKit. Loopback only (never reachable from the LAN) and it sends webhooks to the
# local pulse-app-server. The key/secret pair is a dev-only value, also in .env.example.
# The ports can be moved by docker-compose.yml's environment (PULSE_DEV_LIVEKIT_*).
port: 7880
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: 127.0.0.1
  # Media on loopback only too: without these the UDP/TCP media ports listen on every interface (LAN included).
  enable_loopback_candidate: true
  interfaces:
    includes: [lo]
# Same shape as production: the embedded TURN is the clients' only ICE server (no third-party STUN in the
# join response; server/tests/livekit_ice.rs checks it). Loopback only, like everything else here.
turn:
  enabled: true
  udp_port: 3478
  bind_addresses: ["127.0.0.1"]
keys:
  devkey: pulse-dev-secret-0123456789abcdefghij
webhook:
  api_key: devkey
  urls: ["http://127.0.0.1:7890/livekit/webhook"]
logging:
  level: info
# Codec list: LiveKit's full default plus two strict H.264 entries (profile-level-id 4d001f = Main, 42001f =
# Constrained Baseline, level 3.1). Chromium skips NVIDIA's hardware encoder for the looser Constrained Baseline
# offer (crbug 1088650), so screen shares need the strict entries. This must never be trimmed: dropping audio/red
# breaks voice RED, dropping video/rtx breaks video retransmission.
room:
  enabled_codecs:
    - mime: audio/PCMU
    - mime: audio/PCMA
    - mime: audio/opus
    - mime: audio/red
    - mime: video/VP8
    - mime: video/H264
    - mime: video/H264
      fmtp_line: "level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=4d001f"
    - mime: video/H264
      fmtp_line: "level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=42001f"
    - mime: video/VP9
    - mime: video/AV1
    - mime: video/H265
    - mime: video/rtx
