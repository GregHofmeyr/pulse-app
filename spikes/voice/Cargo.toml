[package]
name = "voice-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
livekit = "0.9.7"
livekit-api = "0.9.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
hound = "3"

# Same patched webrtc-sys as the app (see the root Cargo.toml): the SHA-256 verified libwebrtc download.
[patch.crates-io]
webrtc-sys = { path = "../../vendor/webrtc-sys" }
