[workspace]
resolver = "3"
members = ["protocol", "server", "client/src-tauri"]
exclude = ["spikes", "vendor/webrtc-sys"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "LicenseRef-All-Rights-Reserved"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
ts-rs = { version = "12", features = ["serde-compat"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
pulse-protocol = { path = "protocol" }

# Noise suppression in dev/test builds: tract's debug-only graph check rejects DeepFilterNet's
# model (a harmless duplicate node name, tract-core graph.rs `compact`), and unoptimised tract is
# far too slow for real time. Build these crates like release, even in dev.
[profile.dev.package.deep_filter]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-pulse]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-nnef]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-onnx-opl]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-pulse-opl]
opt-level = 3
debug-assertions = false
[profile.dev.package.nnnoiseless]
opt-level = 3

# argon2 (and the blake2 it hashes with) unoptimised takes ~0.5 s per password check, and the
# server allows only 2 at once per process: a test binary full of logins then queues past the
# client's 15 s timeout. Optimising them changes build speed only, not the hash parameters.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Release builds (installer, test kit, server image). Fat LTO + one codegen unit: smaller code
# (tract/ndarray generics are otherwise duplicated across 16 units) for about 3x the build time.
# Measured with strip: Linux binary -33 MB, Windows -2.8 MB; speed was not measured. strip also
# drops symbol names from native backtraces; nothing reads them today (crash reports carry the
# panic message and file:line, which survive it). Panics still unwind: a panicking tokio task
# (gateway, outbox, voice) must not take the whole app down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# libwebrtc formats every RTC_LOG line at LS_VERBOSE and hands it to Rust only to be dropped
# (measured: 501 lines/s in a call, tests/webrtc_log_volume.rs). The vendored copy registers its
# sink at LS_WARNING (src/webrtc.cpp's AddLogToStream). It also verifies the prebuilt libwebrtc
# archive against pinned SHA-256s before extracting it (libwebrtc_download.rs, called from build.rs;
# upstream extracts it unverified). And its PeerConnection wrapper closes the PeerConnection before
# releasing it (src/peer_connection.cpp, ~PeerConnection): dropped mid-SetRemoteDescription, the
# upstream one aborts the process with a pure virtual call (tests/webrtc_teardown.rs). Those are the
# only three changes. Drop the log change when upstream makes the severity follow log::max_level(),
# the close once upstream's destructor closes; keep the verification while we patch.
# Side effects of the log change: libwebrtc's info/verbose lines are gone at the source, so seeing
# them (a WebRTC deep-dive) needs a build with the stock severity in src/webrtc.cpp. And the
# libwebrtc crate logs every line at debug whatever its severity, so even its warnings and errors
# only show with `PULSE_LOG=libwebrtc=debug`, never in a default log or bug report.
#
# webrtc-sys-build is upstream's again (0.3.21 is on zip 9; the lockfile keeps zip at 9.0.5 or
# later, past GHSA-m665-v7pm-7grj).
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
