[workspace]
resolver = "3"
members = ["protocol", "server", "client/src-tauri"]
exclude = ["spikes", "vendor/webrtc-sys"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "LicenseRef-All-Rights-Reserved"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
ts-rs = { version = "12", features = ["serde-compat"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
pulse-protocol = { path = "protocol" }

# Noise suppression in dev/test builds: tract's debug-only graph check rejects DeepFilterNet's
# model (a harmless duplicate node name, tract-core graph.rs `compact`), and unoptimised tract is
# far too slow for real time. Build these crates like release, even in dev.
[profile.dev.package.deep_filter]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-pulse]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-nnef]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-onnx-opl]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-pulse-opl]
opt-level = 3
debug-assertions = false
[profile.dev.package.nnnoiseless]
opt-level = 3

# argon2 (and the blake2 it hashes with) unoptimised takes ~0.5 s per password check, and the
# server allows only 2 at once per process: a test binary full of logins then queues past the
# client's 15 s timeout. Optimising them changes build speed only, not the hash parameters.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Release builds (installer, test kit, server image). Fat LTO + one codegen unit: smaller, slightly
# faster code (tract/ndarray generics are otherwise duplicated across 16 units); it costs build
# time only. strip: the Linux binary carried ~20 MB of symbols (Windows writes no PDB). Panics still
# unwind: a panicking tokio task (gateway, outbox, voice) must not take the whole app down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# libwebrtc formats every RTC_LOG line at LS_VERBOSE and hands it to Rust only to be dropped
# (measured: 501 lines/s in a call, tests/webrtc_log_volume.rs). The vendored copy registers its
# sink at LS_WARNING (src/webrtc.cpp's AddLogToStream). It also verifies the prebuilt libwebrtc
# archive against pinned SHA-256s before extracting it (libwebrtc_download.rs, called from build.rs;
# upstream extracts it unverified). Those are the only two changes. Drop the log change when
# upstream makes the severity follow log::max_level(); keep the verification while we patch.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
