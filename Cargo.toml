[workspace]
resolver = "3"
members = ["protocol", "server", "client/src-tauri"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "LicenseRef-All-Rights-Reserved"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
ts-rs = { version = "12", features = ["serde-compat"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
pulse-protocol = { path = "protocol" }
