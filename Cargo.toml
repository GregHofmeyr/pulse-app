[workspace]
resolver = "3"
members = ["protocol", "server", "client/src-tauri"]
exclude = ["spikes", "vendor/webrtc-sys", "vendor/livekit"]

[workspace.package]
edition = "2024"
version = "0.2.10"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
ts-rs = { version = "12", features = ["serde-compat"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
pulse-protocol = { path = "protocol" }

# Noise suppression in dev/test builds: tract's debug-only graph check rejects DeepFilterNet's
# model (a harmless duplicate node name, tract-core graph.rs `compact`), and unoptimised tract is
# far too slow for real time. Build these crates like release, even in dev.
[profile.dev.package.deep_filter]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-pulse]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-nnef]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-onnx-opl]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-pulse-opl]
opt-level = 3
debug-assertions = false
[profile.dev.package.nnnoiseless]
opt-level = 3

# argon2 (and the blake2 it hashes with) unoptimised takes ~0.5 s per password check, and the
# server allows only 2 at once per process: a test binary full of logins then queues past the
# client's 15 s timeout. Optimising them changes build speed only, not the hash parameters.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Image decoding, resizing and WebP encoding (uploads, link preview thumbnails, Go Live previews).
# Unoptimised, one 1280x720 link thumbnail took ~0.4 s, and the server processes 2 images at once per
# process: a test binary of link previews queued past its 5 s waits under load (#274). Optimised it is
# ~15 ms (the server's resize goes through DynamicImage so it runs this optimised copy, see process.rs).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.libwebp-sys2]
opt-level = 3

# Release builds (installer, server image). Fat LTO + one codegen unit: smaller code
# (tract/ndarray generics are otherwise duplicated across 16 units) for about 3x the build time.
# Measured with strip: Linux binary -33 MB, Windows -2.8 MB; speed was not measured. strip also
# drops symbol names from native backtraces; nothing reads them today (crash reports carry the
# panic message and file:line, which survive it). Panics still unwind: a panicking tokio task
# (gateway, outbox, voice) must not take the whole app down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The Windows client tests in CI (.github/workflows/windows-client-tests.yml, #253): release without the fat-LTO link
# and the single codegen unit, which took ~16 of the job's ~19 min compiling for tests that run in ~10 s. Still a
# release profile: debug_assertions stay off, so the release-only paths (updater::tests::enabled_in_windows_release,
# the windows_subsystem attribute, no PULSE_DEV_FFMPEG_DIR) are what gets compiled and tested. The installer is built
# with `release` and keeps fat LTO.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# libwebrtc formats every RTC_LOG line at LS_VERBOSE and hands it to Rust only to be dropped
# (measured: 501 lines/s in a call, tests/webrtc_log_volume.rs). The vendored copy registers its
# sink at LS_WARNING (src/webrtc.cpp's AddLogToStream). It also verifies the prebuilt libwebrtc
# archive against pinned SHA-256s before extracting it (libwebrtc_download.rs, called from build.rs;
# upstream extracts it unverified). And its PeerConnection wrapper closes the PeerConnection before
# releasing it (src/peer_connection.cpp, ~PeerConnection): dropped mid-SetRemoteDescription, the
# upstream one aborts the process with a pure virtual call (tests/webrtc_teardown.rs). And its ADM
# proxy re-initialises the synthetic audio device on Init (src/adm_proxy.cpp `AdmProxy::Init`,
# src/synthetic_audio_device.cpp): libwebrtc terminates the ADM with the process's last
# PeerConnection and inits it for the next, and upstream's no-op Init left the 10 ms playout pump
# dead, so every call after the first was silent (#216, livekit/rust-sdks#1468;
# tests/webrtc_adm_restart.rs). And its wrapper counts the PeerConnections alive in the process
# (`live_peer_connections`, src/peer_connection.cpp), which only tests read (#227). Those are the
# only five changes. Drop the log change when upstream makes the severity follow log::max_level(),
# the close once upstream's destructor closes, the ADM change once upstream's Init restarts the pump
# (#1468 fixed), the count along with vendor/livekit's patch; keep the verification while we patch.
# Side effects of the log change: libwebrtc's info/verbose lines are gone at the source, so seeing
# them (a WebRTC deep-dive) needs a build with the stock severity in src/webrtc.cpp. And the
# libwebrtc crate logs every line at debug whatever its severity, so even its warnings and errors
# only show with `PULSE_LOG=libwebrtc=debug`, never in a default log or bug report.
#
# webrtc-sys-build is upstream's again (0.3.21 is on zip 9; the lockfile keeps zip at 9.0.5 or
# later, past GHSA-m665-v7pm-7grj).
#
# vendor/livekit is livekit 0.9.7 as published, with two changes. First, `RoomSession::close`
# (src/room/mod.rs) lets go of the remote participants and their publications as if they had all
# left. Each remote publication's mute handlers hold the participant that holds the publication, and
# the engine, so a Room closed while others were still in it kept its engine, PeerConnections and
# tasks for the rest of the app run, one per call left that way (#227;
# client/src-tauri/tests/voice_it.rs `leaving_while_others_stay_releases_the_connection`). Still so
# in livekit 0.10.0. Drop it once upstream's close breaks the cycle, or with the move to 0.10 if
# 0.10 does by then (the patch then needs re-applying to 0.10's source, never the old copy). Second,
# `LocalAudioTrack::transceiver` (src/room/track/local_audio_track.rs) is `pub` instead of
# `pub(crate)`, so a voice channel's bitrate (#75) can change a published mic's RTP sender parameters
# in place rather than republishing it (client/src-tauri/tests/voice_bitrate_it.rs). Still
# `pub(crate)` in 0.10.0: re-apply it there, or drop it if upstream exposes the sender. Its
# Cargo.toml also allows warnings, which a path crate's aren't capped like a crates.io one's.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
livekit = { path = "vendor/livekit" }
