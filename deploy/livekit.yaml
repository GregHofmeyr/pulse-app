# Production LiveKit. Clients reach signalling (7880) only through Caddy at voice.<domain>;
# 7880 itself listens on loopback only (compose uses host networking, so without bind_addresses it would also
# answer on the tailnet and every other interface, bypassing Caddy), and the firewall keeps it closed too.
# bind_addresses covers only that HTTP listener; the RTC and TURN ports are bound separately and stay public.
# The API key "pulse" and its secret come from LIVEKIT_KEYS
# (compose.yml); the Pulse server uses the same pair.
port: 7880
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 7881
  udp_port: 7882
  # The public IP comes from NODE_IP (compose.yml, from LIVEKIT_NODE_IP in .env), never from discovery:
  # use_external_ip would ask Twilio's and Google's public STUN servers for it at every start-up.
  use_external_ip: false
  # Only the public path: without this, clients that are also on the tailnet (or the host itself)
  # get offered the Tailscale/Docker addresses, and their audio skips the route everyone else uses.
  interfaces:
    excludes: [docker0, tailscale0]
# The embedded TURN (UDP) doubles as the clients' STUN server. While it is on, the join response lists only
# turn:<node ip>:3478; without it LiveKit hands every client Twilio's and Google's public STUN servers instead.
# Never set rtc.stun_servers: every entry is handed to clients.
turn:
  enabled: true
  udp_port: 3478
webhook:
  api_key: pulse
  urls: ["http://127.0.0.1:7890/livekit/webhook"]
logging:
  level: info
# Codec list: LiveKit's full default plus two strict H.264 entries (profile-level-id 4d001f = Main, 42001f =
# Constrained Baseline, level 3.1). Chromium skips NVIDIA's hardware encoder for the looser Constrained Baseline
# offer (crbug 1088650), so screen shares need the strict entries. This must never be trimmed: dropping audio/red
# breaks voice RED, dropping video/rtx breaks video retransmission.
room:
  enabled_codecs:
    - mime: audio/PCMU
    - mime: audio/PCMA
    - mime: audio/opus
    - mime: audio/red
    - mime: video/VP8
    - mime: video/H264
    - mime: video/H264
      fmtp_line: "level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=4d001f"
    - mime: video/H264
      fmtp_line: "level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=42001f"
    - mime: video/VP9
    - mime: video/AV1
    - mime: video/H265
    - mime: video/rtx
