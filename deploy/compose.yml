# Pulse production stack. Lives at /srv/pulse/compose.yml; values come from /srv/pulse/.env.
name: pulse

# Hardening (SECURITY.md section 5): every container drops all Linux capabilities and has a process and memory
# ceiling. The memory limits are ceilings against a runaway, well above normal use, not sizing.
# No read_only root filesystem: each image's write paths aren't verified, and a missing one would break production.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  pulse-server:
    # deploy.sh pins PULSE_IMAGE to the pulled digest; PULSE_TAG alone (older .env files) still works.
    image: ${PULSE_IMAGE:-ghcr.io/greghofmeyr/pulse-server:${PULSE_TAG:-latest}}
    network_mode: host
    restart: unless-stopped
    # The server handles SIGTERM too; SIGINT is what it has always handled (belt and braces for
    # an older image). It closes sockets with 1012 and exits in ~0.2 s, so 5 s is plenty.
    stop_signal: SIGINT
    stop_grace_period: 5s
    user: "${PULSE_UID:?}:${PULSE_GID:?}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # A ceiling against a fork/thread bomb, not a working limit: tokio's blocking pool alone may grow to
    # 512 threads (SQLite, Argon2, file I/O), on top of the worker threads.
    pids_limit: 2048
    mem_limit: 1g
    environment:
      PULSE_DB_URL: sqlite:///data/pulse.db
      PULSE_BIND: 127.0.0.1:7890
      PULSE_LIVEKIT_URL: wss://voice.${PULSE_DOMAIN:?}
      # Server-to-LiveKit API (voice presence after a restart): loopback, plain HTTP.
      PULSE_LIVEKIT_API_URL: http://127.0.0.1:7880
      PULSE_LIVEKIT_KEY: pulse
      PULSE_LIVEKIT_SECRET: ${LIVEKIT_SECRET:?}
      PULSE_TOTP_KEY: ${PULSE_TOTP_KEY:?}
      # Clips storage (deploy/README.md, "Clips storage"). The server treats an empty bucket, key or secret as "not
      # configured" whatever the endpoint is; deploy.sh refuses a half-filled set.
      PULSE_CLIPS_S3_ENDPOINT: https://${R2_ACCOUNT_ID:-unset}.r2.cloudflarestorage.com
      PULSE_CLIPS_S3_BUCKET: ${CLIPS_R2_BUCKET:-}
      PULSE_CLIPS_S3_KEY_ID: ${CLIPS_R2_ACCESS_KEY_ID:-}
      PULSE_CLIPS_S3_SECRET: ${CLIPS_R2_SECRET_ACCESS_KEY:-}
      RUST_LOG: info,sqlx=warn
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7890 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    network_mode: host
    restart: unless-stopped
    user: "${PULSE_UID:?}:${PULSE_GID:?}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # A ceiling, not a working limit: Go's runtime starts an OS thread per blocked syscall, so a busy SFU
    # can use hundreds.
    pids_limit: 2048
    mem_limit: 2g
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "pulse: ${LIVEKIT_SECRET:?}"
      # The public IPv4 LiveKit advertises to clients (livekit.yaml has use_external_ip off: no STUN lookup).
      NODE_IP: ${LIVEKIT_NODE_IP:?}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    logging: *logging

  caddy:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    network_mode: host
    restart: unless-stopped
    user: "${PULSE_UID:?}:${PULSE_GID:?}"
    # Caddy runs as the non-root pulse user and still binds 80 and 443: the image grants /usr/bin/caddy the
    # cap_net_bind_service file capability, and host networking keeps the host's unprivileged-port floor (1024).
    # no-new-privileges would stop that file capability from taking effect, so caddy goes without it; it keeps
    # NET_BIND_SERVICE in its bounding set and nothing else.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # Caddy only proxies two sites: 512 is ample.
    pids_limit: 512
    mem_limit: 512m
    environment:
      PULSE_DOMAIN: ${PULSE_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    logging: *logging
